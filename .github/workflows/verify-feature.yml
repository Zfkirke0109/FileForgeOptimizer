name: Verify feature branch

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test, lint, and assemble debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload unsigned debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileForgeOptimizer-unsigned-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
