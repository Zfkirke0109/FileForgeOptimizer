name: Verify feature branch

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: fileforge-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
      - name: Install Android SDK and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.88.0 --profile minimal --target aarch64-linux-android
          rustup default 1.88.0
          cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d  # v4
        with:
          gradle-version: '8.10.2'
      - name: Build pinned native tools
        run: |
          bash scripts/fetch-native-sources.sh
          bash scripts/build-native-tools.sh
      - name: Determine whether to run the large streaming regression
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          DELETED: ${{ github.event.deleted }}
        run: |
          run_large_streaming_test=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_large_streaming_test=true
          elif [[ "$DELETED" == "true" || -z "$AFTER_SHA" || "$AFTER_SHA" =~ ^0+$ ]]; then
            run_large_streaming_test=true
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            run_large_streaming_test=true
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || \
            ! git cat-file -e "${AFTER_SHA}^{commit}" 2>/dev/null; then
            run_large_streaming_test=true
          elif git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- \
            app/src/main/java/com/fileforge/optimizer/StreamingZipOptimizer.kt \
            app/src/main/java/com/fileforge/optimizer/CancellationToken.kt \
            app/src/test/java/com/fileforge/optimizer/LargeStreamingZipTest.kt | \
            grep -F -x -q -e app/src/main/java/com/fileforge/optimizer/StreamingZipOptimizer.kt \
              -e app/src/main/java/com/fileforge/optimizer/CancellationToken.kt \
              -e app/src/test/java/com/fileforge/optimizer/LargeStreamingZipTest.kt; then
            run_large_streaming_test=true
          fi

          echo "FILEFORGE_RUN_LARGE_STREAMING_TEST=$run_large_streaming_test" >> "$GITHUB_ENV"
      - name: Test, lint, and assemble both debug variants
        run: >-
          gradle
          :app:testStandardDebugUnitTest
          :app:testNativeArm64DebugUnitTest
          :app:lintStandardDebug
          :app:lintNativeArm64Debug
          :app:assembleStandardDebug
          :app:assembleNativeArm64Debug
          :app:assembleStandardDebugAndroidTest
      - name: Report large streaming metrics
        if: env.FILEFORGE_RUN_LARGE_STREAMING_TEST == 'true'
        run: |
          results_file=app/build/test-results/testStandardDebugUnitTest/TEST-com.fileforge.optimizer.LargeStreamingZipTest.xml
          if [[ ! -f "$results_file" ]]; then
            echo "Large streaming test results were not produced" >&2
            exit 1
          fi

          mapfile -t metrics < <(
            grep -E -o \
              'FILEFORGE_LARGE_STREAMING_METRICS payloadBytes=[0-9]+ wallTimeMillis=[0-9]+ maxHeapDeltaBytes=[0-9]+' \
              "$results_file"
          )
          if [[ "${#metrics[@]}" -ne 1 ]]; then
            echo "Expected exactly one large streaming metrics line, found ${#metrics[@]}" >&2
            exit 1
          fi
          echo "${metrics[0]}"
      - name: Upload unsigned debug APKs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: FileForgeOptimizer-unsigned-debug-apks
          path: |
            app/build/outputs/apk/standard/debug/app-standard-debug.apk
            app/build/outputs/apk/nativeArm64/debug/app-nativeArm64-debug.apk
          if-no-files-found: error
