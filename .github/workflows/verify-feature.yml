name: Verify feature branch

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Determine whether to run the large streaming regression
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          DELETED: ${{ github.event.deleted }}
        run: |
          run_large_streaming_test=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_large_streaming_test=true
          elif [[ "$DELETED" == "true" || -z "$AFTER_SHA" || "$AFTER_SHA" =~ ^0+$ ]]; then
            run_large_streaming_test=true
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            run_large_streaming_test=true
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || \
            ! git cat-file -e "${AFTER_SHA}^{commit}" 2>/dev/null; then
            run_large_streaming_test=true
          elif git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- \
            app/src/main/java/com/fileforge/optimizer/StreamingZipOptimizer.kt \
            app/src/main/java/com/fileforge/optimizer/CancellationToken.kt \
            app/src/test/java/com/fileforge/optimizer/LargeStreamingZipTest.kt | \
            grep -F -x -q -e app/src/main/java/com/fileforge/optimizer/StreamingZipOptimizer.kt \
              -e app/src/main/java/com/fileforge/optimizer/CancellationToken.kt \
              -e app/src/test/java/com/fileforge/optimizer/LargeStreamingZipTest.kt; then
            run_large_streaming_test=true
          fi

          echo "FILEFORGE_RUN_LARGE_STREAMING_TEST=$run_large_streaming_test" >> "$GITHUB_ENV"
      - name: Test, lint, and assemble debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Report large streaming metrics
        if: env.FILEFORGE_RUN_LARGE_STREAMING_TEST == 'true'
        run: |
          results_file=app/build/test-results/testDebugUnitTest/TEST-com.fileforge.optimizer.LargeStreamingZipTest.xml
          if [[ ! -f "$results_file" ]]; then
            echo "Large streaming test results were not produced" >&2
            exit 1
          fi

          mapfile -t metrics < <(
            grep -E -o \
              'FILEFORGE_LARGE_STREAMING_METRICS payloadBytes=[0-9]+ wallTimeMillis=[0-9]+ maxHeapDeltaBytes=[0-9]+' \
              "$results_file"
          )
          if [[ "${#metrics[@]}" -ne 1 ]]; then
            echo "Expected exactly one large streaming metrics line, found ${#metrics[@]}" >&2
            exit 1
          fi
          echo "${metrics[0]}"
      - name: Upload unsigned debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileForgeOptimizer-unsigned-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
