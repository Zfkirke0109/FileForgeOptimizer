name: Lint shell and YAML

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fileforge-lint-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install pinned yamllint
        shell: bash
        run: |
          set -euo pipefail
          # A virtualenv keeps this working on runner images that mark the
          # system interpreter externally managed (PEP 668).
          python3 -m venv "$RUNNER_TEMP/yamllint"
          "$RUNNER_TEMP/yamllint/bin/pip" install \
            --disable-pip-version-check --no-input yamllint==1.38.0
          echo "$RUNNER_TEMP/yamllint/bin" >> "$GITHUB_PATH"

      - name: Install checksum-verified ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  %s\n' "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP" --strip-components=1 shellcheck-v0.11.0/shellcheck
          chmod 755 "$RUNNER_TEMP/shellcheck"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint workflow and configuration YAML
        run: yamllint --strict --config-file .yamllint .github .yamllint

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
