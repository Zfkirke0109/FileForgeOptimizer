plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fileforge.optimizer'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    defaultConfig {
        applicationId 'com.fileforge.optimizer'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    flavorDimensions 'distribution'
    productFlavors {
        standard {
            dimension 'distribution'
            buildConfigField 'String', 'FILEFORGE_VARIANT', '"standard"'
            buildConfigField 'String', 'DISTRIBUTION_VARIANT', '"standard"'
            buildConfigField 'String', 'RELEASE_ASSET_KIND', '"STANDARD"'
            buildConfigField 'String', 'PACKAGED_ABI', '"none"'
            buildConfigField 'int', 'NATIVE_TOOL_COUNT', '0'
        }
        nativeArm64 {
            dimension 'distribution'
            buildConfigField 'String', 'FILEFORGE_VARIANT', '"native-arm64"'
            buildConfigField 'String', 'DISTRIBUTION_VARIANT', '"native-arm64"'
            buildConfigField 'String', 'RELEASE_ASSET_KIND', '"NATIVE_ARM64"'
            buildConfigField 'String', 'PACKAGED_ABI', '"arm64-v8a"'
            buildConfigField 'int', 'NATIVE_TOOL_COUNT', '5'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    applicationVariants.configureEach { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.configureEach { output ->
                output.outputFileName = variant.flavorName == 'nativeArm64' \
                    ? 'FileForgeOptimizer-native-arm64.apk' \
                    : 'FileForgeOptimizer-standard.apk'
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
