plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fileforge.optimizer'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    defaultConfig {
        applicationId 'com.fileforge.optimizer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-mvp'
        buildConfigField 'String', 'DISTRIBUTION_VARIANT', '"standard"'
        buildConfigField 'String', 'RELEASE_ASSET_KIND', '"STANDARD"'
        buildConfigField 'String', 'PACKAGED_ABI', '"none"'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
