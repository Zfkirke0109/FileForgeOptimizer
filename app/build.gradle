plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fileforge.optimizer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fileforge.optimizer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-mvp'
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
